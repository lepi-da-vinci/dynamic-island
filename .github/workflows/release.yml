name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Unpacked Distribution for Zip and Installer Script
        run: |
          dotnet publish src/WindowsDynamicIsland/WindowsDynamicIsland.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o ./publish-unpacked
          Copy-Item ./publish-unpacked/WindowsDynamicIsland.exe ./publish-unpacked/Uninstall.exe -Force
          Copy-Item src/WindowsDynamicIsland/Assets/app_icon.ico ./publish-unpacked/app_icon.ico -Force

      - name: Publish Uncompressed Standalone Setup Executable
        run: |
          dotnet publish src/WindowsDynamicIsland/WindowsDynamicIsland.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=false `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o ./publish-single
          Copy-Item ./publish-single/WindowsDynamicIsland.exe ./publish-single/WindowsDynamicIsland-Setup.exe -Force

      - name: Sign Binaries with Authenticode Certificate
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Lepi Da Vinci, O=Windows Dynamic Island" -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          Set-AuthenticodeSignature -FilePath "./publish-unpacked/WindowsDynamicIsland.exe" -Certificate $cert | Out-Null
          Set-AuthenticodeSignature -FilePath "./publish-unpacked/Uninstall.exe" -Certificate $cert | Out-Null
          Set-AuthenticodeSignature -FilePath "./publish-unpacked/WindowsDynamicIsland.dll" -Certificate $cert | Out-Null
          Set-AuthenticodeSignature -FilePath "./publish-single/WindowsDynamicIsland.exe" -Certificate $cert | Out-Null
          Set-AuthenticodeSignature -FilePath "./publish-single/WindowsDynamicIsland-Setup.exe" -Certificate $cert | Out-Null

      - name: Create Zip Archive
        run: |
          Compress-Archive -Path ./publish-unpacked/* -DestinationPath ./WindowsDynamicIsland-win-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Windows Dynamic Island ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./publish-single/WindowsDynamicIsland-Setup.exe
            ./publish-single/WindowsDynamicIsland.exe
            ./WindowsDynamicIsland-win-x64.zip
          body: |
            ## Windows Dynamic Island ${{ github.ref_name }}

            ### Pembaruan Keamanan & Kompatibilitas Windows Defender
            * **Zero False-Positive Heuristics**: Menghapus penggunaan fungsi Win32 `GetAsyncKeyState` / `GetKeyState`, blok `unsafe`, dan kompresi *single-file packer* yang sebelumnya memicu deteksi *false-positive* pada Windows Defender dan Windows 11 Application Control.
            * **Authenticode Local Signing & Unpacked Runtime**: Mendukung penandatanganan sertifikat digital lokal otomatis saat instalasi via PowerShell serta menyertakan pustaka runtime resmi bertanda tangan digital Microsoft Corporation.
            * **Standard Windows Installer & Uninstaller**: Terdaftar resmi di **Windows Settings -> Apps -> Installed Apps (Add or Remove Programs)**, Start Menu, Desktop Shortcut, dan Startup otomatis.

            ### Panduan Instalasi & Uninstall
            **Cara 1 - One-Click Standard Installer (PowerShell - Paling Direkomendasikan & Bebas Blokir Defender):**
            ```powershell
            irm https://raw.githubusercontent.com/lepi-da-vinci/dynamic-island/main/install.ps1 | iex
            ```

            **Cara 2 - GUI Setup Wizard (`WindowsDynamicIsland-Setup.exe`):**
            Unduh dan jalankan `WindowsDynamicIsland-Setup.exe` untuk membuka jendela Setup Wizard standar Windows.

            **Cara Uninstall Normal:**
            * Buka **Windows Settings -> Apps -> Installed Apps** (atau *Control Panel -> Programs and Features*), cari **Windows Dynamic Island**, lalu klik **Uninstall**.
            * Atau buka **Start Menu -> Windows Dynamic Island -> Uninstall Windows Dynamic Island**.
            * Atau jalankan di PowerShell: `irm https://raw.githubusercontent.com/lepi-da-vinci/dynamic-island/main/uninstall.ps1 | iex`
