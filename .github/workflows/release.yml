name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Standalone Executable and Setup Installer
        run: |
          dotnet publish src/WindowsDynamicIsland/WindowsDynamicIsland.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o ./publish
          Copy-Item ./publish/WindowsDynamicIsland.exe ./publish/WindowsDynamicIsland-Setup.exe -Force

      - name: Create Zip Archive
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./WindowsDynamicIsland-win-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Windows Dynamic Island ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./publish/WindowsDynamicIsland-Setup.exe
            ./publish/WindowsDynamicIsland.exe
            ./WindowsDynamicIsland-win-x64.zip
          body: |
            ## Windows Dynamic Island ${{ github.ref_name }}

            ### Fitur Utama
            * **Standard Windows Installer & Uninstaller**: Mendukung instalasi standar Windows (`WindowsDynamicIsland-Setup.exe`) yang terdaftar resmi di **Windows Settings -> Apps -> Installed Apps (Add or Remove Programs)**, Start Menu, Desktop Shortcut, dan Startup otomatis.
            * **NotchNook Silhouette**: Satu desain utuh menempel di atas layar monitor (`Y = 0`).
            * **Zero Emojis**: 20 Custom Bespoke Vector SVG Path geometries.
            * **5-Band Real-Time Equalizer**: Menggunakan native WASAPI Loopback PCM Capture selaras ketukan lagu.
            * **Synced Lyrics**: Lirik mengambang real-time via LRCLIB dengan cache offline.
            * **Tucked Mode & WS_EX_TRANSPARENT**: Melipat 5px saat membuka aplikasi di belakangnya; tab Chrome/Edge bebas diklik.
            * **File Drop Shelf**: Rak penyimpanan file sementara (drag & drop masuk/keluar).
            * **Multi-Role Mic Mute**: Deteksi dan kontrol mute instan (Realtek internal & Bluetooth headset).
            * **Wi-Fi & Bluetooth Alerts**: OSD Toast otomatis saat tersambung atau terputus.

            ### Panduan Instalasi & Uninstall
            **Cara 1 - One-Click Standard Installer (PowerShell - Bebas Layar Biru SmartScreen):**
            ```powershell
            irm https://raw.githubusercontent.com/lepi-da-vinci/dynamic-island/main/install.ps1 | iex
            ```

            **Cara 2 - GUI Setup Wizard (`WindowsDynamicIsland-Setup.exe`):**
            Unduh dan jalankan `WindowsDynamicIsland-Setup.exe` untuk membuka jendela Setup Wizard standar Windows.

            **Cara Uninstall Normal:**
            * Buka **Windows Settings -> Apps -> Installed Apps** (atau *Control Panel -> Programs and Features*), cari **Windows Dynamic Island**, lalu klik **Uninstall**.
            * Atau buka **Start Menu -> Windows Dynamic Island -> Uninstall Windows Dynamic Island**.
            * Atau jalankan di PowerShell: `irm https://raw.githubusercontent.com/lepi-da-vinci/dynamic-island/main/uninstall.ps1 | iex`
