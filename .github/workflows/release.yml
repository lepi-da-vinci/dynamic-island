name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Standalone Executable
        run: |
          dotnet publish src/WindowsDynamicIsland/WindowsDynamicIsland.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o ./publish

      - name: Create Zip Archive
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./WindowsDynamicIsland-win-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Windows Dynamic Island ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./WindowsDynamicIsland-win-x64.zip
            ./publish/WindowsDynamicIsland.exe
          body: |
            ## Windows Dynamic Island ${{ github.ref_name }}

            ### Fitur Unggulan
            * **NotchNook Silhouette**: Satu desain utuh menempel di atas layar monitor (`Y = 0`).
            * **Zero Emojis**: 20 Custom Bespoke Vector SVG Path geometries.
            * **5-Band Real-Time Equalizer**: Menggunakan native WASAPI Loopback PCM Capture selaras ketukan lagu.
            * **Synced Lyrics**: Lirik mengambang real-time via LRCLIB dengan cache offline.
            * **Tucked Mode & WS_EX_TRANSPARENT**: Melipat 5px saat membuka aplikasi di belakangnya; tab Chrome/Edge bebas diklik.
            * **File Drop Shelf**: Rak penyimpanan file sementara (drag & drop masuk/keluar).
            * **Multi-Role Mic Mute**: Deteksi dan kontrol mute instan (Realtek internal & Bluetooth headset).
            * **Wi-Fi & Bluetooth Alerts**: OSD Toast otomatis saat tersambung atau terputus.

            ### Panduan Menjalankan
            **Cara 1 - Instal Otomatis Tanpa Peringatan SmartScreen (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/lepi-da-vinci/dynamic-island/main/install.ps1 | iex
            ```

            **Cara 2 - Unduh Langsung:**
            Unduh `WindowsDynamicIsland.exe` (portabel dengan seluruh pustaka native WPF di dalamnya) atau ekstrak `WindowsDynamicIsland-win-x64.zip`. Jika muncul jendela biru Windows SmartScreen saat dibuka pertama kali, klik **More info** lalu klik **Run anyway**.
